<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Content | Signify Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/lesson_content.js"></script>
</head>

<body class="bg-gray-100 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg flex flex-col">
        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-indigo-600">Signify Admin</h1>
        </div>

        <nav class="flex-1 p-4 space-y-2 text-gray-700">
            <a href="admin.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="home" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="lessons.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="book-open" class="w-5 h-5"></i> Manage Lessons
            </a>
            <a href="gestures.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="hand" class="w-5 h-5"></i> Gestures
            </a>
            <a href="users.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="users" class="w-5 h-5"></i> Users
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-8 space-y-8">
        <div class="flex items-center gap-4 border-b border-gray-300 pb-3 mb-6">
            <button onclick="window.history.back()"
                class="flex items-center gap-2 px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">
                ← Back
            </button>
            <h2 id="lessonTitle" class="text-3xl font-bold text-gray-800">Lesson Content</h2>
        </div>

        <div class="flex border-b border-gray-300 space-x-6 mb-6">
            <button id="tab-signs"
                class="pb-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold">Signs</button>
            <button id="tab-questions" class="pb-2 text-gray-600 hover:text-indigo-600">Questions</button>
        </div>

        <div id="signsSection" class="space-y-4"></div>
        <div id="questionsSection" class="space-y-4 hidden"></div>

        <div id="modalContainer"
            class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 hidden">
            <div class="bg-white rounded-lg p-6 w-[30rem] z-50">
                ...
            </div>
        </div>


    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        const currentPage = window.location.pathname.split("/").pop();

        document.querySelectorAll("aside nav a").forEach((link) => {
            const href = link.getAttribute("href");

            // Make "Manage Lessons" active on both lessons.html and lesson_content.html
            if (
                currentPage === href ||
                (currentPage === "lesson_content.html" && href === "lessons.html")
            ) {
                link.classList.add(
                    "bg-indigo-100",
                    "text-indigo-600",
                    "font-semibold"
                );
                const icon = link.querySelector("i");
                if (icon) icon.classList.add("text-indigo-600");
            }
        });
    </script>

</body>

</html>
