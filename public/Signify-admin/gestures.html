<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Collector | Signify Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">
        import { supabase } from "./js/supabaseClient.js";

        lucide.createIcons();

        const webcamEl = document.getElementById("webcam");
        const labelInput = document.getElementById("labelInput");
        const saveBtn = document.getElementById("saveBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const statusEl = document.getElementById("status");
        const sampleList = document.getElementById("sampleList");

        let currentLandmarks = null;
        let gestureSamples = [];

        // 🖐 Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7,
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks?.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentLandmarks = landmarks.map((pt) => ({ x: pt.x, y: pt.y, z: pt.z }));
            }
        });

        // 📸 Start camera
        try {
            const camera = new Camera(webcamEl, {
                onFrame: async () => await hands.send({ image: webcamEl }),
                width: 640,
                height: 480,
            });
            camera.start();
            console.log("✅ Camera started successfully!");
        } catch (err) {
            console.error("Camera start error:", err);
            statusEl.textContent = "⚠️ Please allow camera permissions and refresh.";
        }

        // 🎬 Start gesture capture
        saveBtn.onclick = async () => {
            const gloss = labelInput.value.trim().toUpperCase();
            if (!gloss) {
                statusEl.textContent = "⚠️ Please enter a gesture name first.";
                return;
            }

            let countdown = 3;
            statusEl.textContent = `⏳ Get ready... ${countdown}`;
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) statusEl.textContent = `⏳ Get ready... ${countdown}`;
                else {
                    clearInterval(countdownInterval);
                    startCapture(gloss);
                }
            }, 1000);
        };

        async function startCapture(gloss) {
            statusEl.textContent = `🎥 Capturing samples for "${gloss}"...`;
            const duration = 6000;
            const intervalMs = 200;
            const endTime = Date.now() + duration;
            let captured = 0;

            const captureInterval = setInterval(async () => {
                if (Date.now() >= endTime) {
                    clearInterval(captureInterval);
                    statusEl.textContent = `✅ Done! Captured ${captured} samples for "${gloss}".`;
                    loadSummary();
                    return;
                }

                if (currentLandmarks?.length === 21) {
                    const sample = { gloss, landmarks: currentLandmarks };
                    const { error } = await supabase.from("gesture_sample").insert([sample]);
                    if (!error) {
                        gestureSamples.push(sample);
                        captured++;
                        statusEl.textContent = `📸 Capturing... ${captured}`;
                    } else {
                        console.error("❌ Supabase insert error:", error);
                        statusEl.textContent = "❌ Error saving sample.";
                    }
                } else {
                    statusEl.textContent = "⚠️ No valid hand detected. Keep your hand in view.";
                }
            }, intervalMs);
        }

        // 📊 Load sample summary
        async function loadSummary() {
            const { data, error } = await supabase.from("gesture_sample").select("gloss");
            if (error) {
                console.error("Error loading samples:", error);
                return;
            }

            const counts = data.reduce((acc, row) => {
                acc[row.gloss] = (acc[row.gloss] || 0) + 1;
                return acc;
            }, {});

            sampleList.innerHTML = Object.keys(counts).length
                ? Object.entries(counts)
                    .map(
                        ([gloss, count]) =>
                            `<li class="flex justify-between border-b py-1"><span>${gloss}</span><span class="font-semibold text-indigo-600">${count}</span></li>`
                    )
                    .join("")
                : `<li class="text-gray-500">No samples yet.</li>`;
        }

        // 💾 Download collected samples
        downloadBtn.onclick = () => {
            if (gestureSamples.length === 0) {
                alert("No samples collected yet!");
                return;
            }
            const blob = new Blob([JSON.stringify(gestureSamples, null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "gesture_data.json";
            link.click();
        };

        // 🧠 Train & Upload Model button
        document.getElementById("trainModelBtn").onclick = async () => {
            const statusEl = document.getElementById("trainStatus");
            statusEl.textContent = "⏳ Starting model training...";

            try {
                const res = await fetch("/train-model", { method: "POST" });
                if (res.ok) {
                    statusEl.textContent = "✅ Model training started! Check server logs for progress.";
                } else {
                    statusEl.textContent = "❌ Failed to trigger training.";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "⚠️ Could not reach backend server.";
            }
        };

        // 🚪 Logout function
        window.logout = async () => {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert("Logout failed. Please try again.");
                console.error(error);
            } else {
                window.location.href = "https://solid-couscous-97x4ggjj7qjvfpvj6-5500.app.github.dev/login.html"; // Redirect after logout
            }
        };

        loadSummary();
    </script>
</head>

<body class="bg-gray-100 flex min-h-screen text-gray-800">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg flex flex-col">
        <div class="p-6 border-b flex items-center gap-2">
            <i data-lucide="brain" class="w-6 h-6 text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-indigo-600">Signify Admin</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 text-gray-700">
            <a href="admin.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="home" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="lessons.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="book-open" class="w-5 h-5"></i> Manage Lessons
            </a>
            <a href="gestures.html"
                class="flex items-center gap-2 p-2 rounded bg-indigo-100 text-indigo-600 font-semibold">
                <i data-lucide="hand" class="w-5 h-5"></i> Gestures
            </a>
            <a href="users.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="users" class="w-5 h-5"></i> Users
            </a>
        </nav>

        <!-- Logout Button -->
        <div class="p-4 border-t">
            <button onclick="logout()"
                class="w-full flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 text-white py-2 rounded transition">
                <i data-lucide="log-out" class="w-5 h-5"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="hand" class="w-7 h-7 text-indigo-600"></i>
                Gesture Dataset Collector
            </h2>

            <button id="trainModelBtn"
                class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
                <i data-lucide="cpu" class="w-5 h-5"></i> Train & Upload Model
            </button>
        </div>
        <p id="trainStatus" class="text-sm text-gray-500 mb-6"></p>

        <div class="flex flex-col md:flex-row gap-6">
            <!-- Camera -->
            <div class="flex flex-col items-center bg-white shadow rounded-lg p-6 w-full md:w-2/3">
                <video id="webcam" class="rounded-lg border border-gray-300 mb-4" width="640" height="480" autoplay
                    playsinline></video>

                <div class="w-full">
                    <label class="block text-sm font-medium mb-1">Gesture Gloss (e.g. WATER, HELLO)</label>
                    <input id="labelInput" type="text" placeholder="Enter gesture label"
                        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <div class="mt-4 flex gap-3">
                    <button id="saveBtn"
                        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">
                        <i data-lucide="video" class="w-5 h-5"></i> Start Capture
                    </button>
                    <button id="downloadBtn"
                        class="flex items-center gap-2 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">
                        <i data-lucide="download" class="w-5 h-5"></i> Download JSON
                    </button>
                </div>

                <p id="status" class="mt-4 text-indigo-600 font-medium text-sm"></p>
            </div>

            <!-- Summary -->
            <div class="bg-white shadow rounded-lg p-6 w-full md:w-1/3">
                <h3 class="text-lg font-semibold mb-3 text-gray-700 flex items-center gap-2">
                    <i data-lucide="bar-chart" class="w-5 h-5 text-indigo-600"></i> Collected Samples
                </h3>
                <ul id="sampleList" class="text-sm space-y-2 text-gray-600"></ul>
            </div>
        </div>
    </main>
</body>

</html>
