<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources | Signify Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">
        import { supabase } from "./js/supabaseClient.js";

        lucide.createIcons();

        const resourceList = document.getElementById("resourceList");
        const uploadForm = document.getElementById("uploadForm");
        const categoryInput = document.getElementById("categoryInput");
        const fileInput = document.getElementById("fileInput");
        const uploadStatus = document.getElementById("uploadStatus");

        // 🧠 Load existing resources
        async function loadResources() {
            resourceList.innerHTML = "<p class='text-gray-500'>Loading...</p>";

            const { data, error } = await supabase.storage.from("signs").list("", {
                limit: 1000,
                sortBy: { column: "name", order: "asc" },
            });

            if (error) {
                console.error("Error loading resources:", error);
                resourceList.innerHTML = `<p class='text-red-500'>Error loading resources.</p>`;
                return;
            }

            if (!data.length) {
                resourceList.innerHTML = `<p class='text-gray-500'>No resources uploaded yet.</p>`;
                return;
            }

            resourceList.innerHTML = data
                .map(
                    (file) => `
          <div class="bg-white shadow rounded-lg p-4 flex justify-between items-center hover:shadow-md transition">
            <div class="flex items-center gap-4">
              <img src="${supabase.storage.from("signs").getPublicUrl(file.name).data.publicUrl}"
                class="w-16 h-16 object-contain border rounded-lg" alt="${file.name}" />
              <div>
                <h4 class="font-semibold text-gray-800">${file.name}</h4>
                <p class="text-sm text-gray-500">${(file.metadata?.size / 1024)?.toFixed(1) || "?"} KB</p>
              </div>
            </div>
            <button onclick="deleteResource('${file.name}')"
              class="text-red-500 hover:text-red-700 flex items-center gap-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
            </button>
          </div>`
                )
                .join("");

            lucide.createIcons();
        }

        // 📤 Upload multiple resources
        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const category = categoryInput.value.trim().toUpperCase() || "UNCATEGORIZED";
            const files = Array.from(fileInput.files);

            if (files.length === 0) {
                uploadStatus.textContent = "⚠️ Please select one or more files to upload.";
                return;
            }

            uploadStatus.textContent = `⏳ Uploading ${files.length} file(s)...`;
            let uploaded = 0;

            for (const [i, file] of files.entries()) {
                const fileName = `${category}_${file.name}`;
                const { error } = await supabase.storage.from("signs").upload(fileName, file, {
                    cacheControl: "3600",
                    upsert: true,
                });

                if (error) {
                    console.error("❌ Upload error:", error);
                    uploadStatus.textContent = `❌ Failed to upload ${fileName}`;
                    return;
                }

                uploaded++;
                uploadStatus.textContent = `📸 Uploaded ${uploaded}/${files.length}...`;
            }

            uploadStatus.textContent = `✅ Successfully uploaded ${uploaded} file(s)!`;
            categoryInput.value = "";
            fileInput.value = "";
            loadResources();
        });

        // 🗑 Delete resource
        window.deleteResource = async (fileName) => {
            if (!confirm(`Delete ${fileName}?`)) return;

            const { error } = await supabase.storage.from("signs").remove([fileName]);
            if (error) {
                alert("❌ Failed to delete.");
                console.error(error);
            } else {
                alert("✅ Deleted successfully!");
                loadResources();
            }
        };

        loadResources();
    </script>
</head>

<body class="bg-gray-100 flex min-h-screen text-gray-800">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg flex flex-col">
        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-indigo-600">Signify Admin</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 text-gray-700">
            <a href="admin.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="home" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="lessons.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="book-open" class="w-5 h-5"></i> Manage Lessons
            </a>
            <a href="gestures.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="hand" class="w-5 h-5"></i> Gestures
            </a>
            <a href="model_management.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="brain-circuit" class="w-5 h-5"></i> Model Management
            </a>
            <a href="users.html" class="flex items-center gap-2 p-2 rounded hover:bg-indigo-100">
                <i data-lucide="users" class="w-5 h-5"></i> Users
            </a>
            <a href="resources.html"
                class="flex items-center gap-2 p-2 rounded bg-indigo-100 text-indigo-600 font-semibold">
                <i data-lucide="folder-open" class="w-5 h-5"></i> Resources
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 space-y-6">
        <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="folder-open" class="w-8 h-8 text-indigo-600"></i>
            Resource Library
        </h2>

        <!-- Upload Section -->
        <div class="bg-white shadow rounded-lg p-6 space-y-4">
            <h3 class="text-lg font-semibold text-gray-700">📤 Upload New Resource</h3>
            <form id="uploadForm" class="space-y-3">
                <input id="categoryInput" type="text" placeholder="Category or Label (optional)"
                    class="w-full border rounded p-2 focus:ring focus:ring-indigo-300" />
                <input id="fileInput" type="file" accept="image/*,video/*" multiple
                    class="w-full border rounded p-2 focus:ring focus:ring-indigo-300" />
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded flex items-center gap-2">
                    <i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload Files
                </button>
                <p id="uploadStatus" class="text-sm text-gray-500 mt-2"></p>
            </form>
        </div>

        <!-- Resource List -->
        <div class="bg-white shadow rounded-lg p-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">🖼 Uploaded Resources</h3>
            <div id="resourceList" class="space-y-3"></div>
        </div>
    </main>
</body>

</html>
