<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="config.js"></script>
  <title>Learn | Signify</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      margin-top: 0.25rem;
      background: #333;
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out both;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      font-weight: 600;
      color: white;
      border-radius: 8px;
      background: transparent;
      transition: background 0.2s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
  </style>
</head>

<body class="flex h-screen bg-gradient-to-br from-[#1C1B2E] via-[#1C1B2E] to-[#14142B]">
  <!-- Sidebar -->
  <aside class="w-[250px] bg-[#14142b] border-r border-[#2a2a3c] p-6 flex flex-col gap-6">
    <h2 class="text-4xl font-extrabold text-[#FFC400] text-center tracking-wide">Signify</h2>
    <nav class="flex flex-col gap-3 mt-4">
      <button class="nav-btn active">
        <i data-lucide="book-open" class="w-5 h-5"></i> LEARN
      </button>
      <button class="nav-btn" onclick="window.location.href='alphabet.html'">
        <i data-lucide="type" class="w-5 h-5"></i> ALPHABET & MORE
      </button>
      <button class="nav-btn" onclick="window.location.href='shop.html'">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i> SHOP
      </button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">
        <i data-lucide="user" class="w-5 h-5"></i> PROFILE
      </button>
      <div class="relative">
        <button id="moreBtn" class="nav-btn w-full justify-between pr-4">
          <div class="flex items-center gap-2">
            <i data-lucide="more-horizontal" class="w-5 h-5"></i> <span>MORE</span>
          </div>
          <svg id="chevron" class="w-4 h-4 transition-transform duration-200 text-white" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="moreDropdown" class="hidden ml-12 mt-1 space-y-1">
          <button onclick="logout()" class="nav-btn text-red-400 hover:bg-[#3a3a55]">
            <i data-lucide="log-out" class="w-5 h-5"></i> LOGOUT
          </button>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto px-6 pb-12">
    <!-- Header Stats -->
    <header
      class="fixed top-6 right-8 flex items-center gap-6 bg-[#2A2A3C] px-6 py-3 rounded-2xl shadow-lg border border-[#C5CAFF] z-20">
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/fire.png" class="w-7 h-7 animate-pulse" alt="Streak">
        <span class="streak-value font-bold">0</span>
      </div>
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/gem.png" class="w-7 h-7" alt="Gems">
        <span class="gems-value font-bold">0</span>
      </div>
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/heart.png" class="w-7 h-7" alt="Hearts">
        <span class="hearts-value font-bold">0</span>
      </div>
    </header>

    <!-- Levels + Lessons -->
    <section class="pt-40">
      <div id="level-container" class="flex flex-col items-center gap-10 px-6"></div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const moreBtn = document.getElementById("moreBtn");
      const moreDropdown = document.getElementById("moreDropdown");
      const chevron = document.getElementById("chevron");

      if (moreBtn && moreDropdown && chevron) {
        moreBtn.addEventListener("click", () => {
          moreDropdown.classList.toggle("hidden");
          chevron.classList.toggle("rotate-180");
        });
      }
    });
  </script>

  <!-- JS Logic -->
  <script>
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadLevels() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const userId = user.id;

      // Always get levels & lessons by order
      const { data: levels } = await supabase.from('levels').select('*').order('order', { ascending: true });
      const { data: lessons } = await supabase.from('lesson').select('*').order('order', { ascending: true });
      const { data: progress } = await supabase.from('user_progress').select('lesson_id').eq('user_id', userId).eq('is_completed', true);

      const completedLessonIds = new Set(progress.map(p => p.lesson_id));
      const container = document.getElementById('level-container');
      container.innerHTML = '';

      levels.forEach((level, levelIndex) => {
        const lessonsForLevel = lessons.filter(l => l.level_id === level.id).sort((a, b) => a.order - b.order);
        const completed = lessonsForLevel.filter(l => completedLessonIds.has(l.id)).length;
        const total = lessonsForLevel.length;
        const progressRatio = total ? completed / total : 0;

        const isUnlocked =
          levelIndex === 0 ||
          levels.slice(0, levelIndex).every(prev => {
            const prevLessons = lessons.filter(l => l.level_id === prev.id);
            return prevLessons.length > 0 && prevLessons.every(l => completedLessonIds.has(l.id));
          });

        const levelCard = document.createElement('div');
        levelCard.className =
          'w-full max-w-3xl bg-[#2A2A3C] p-6 rounded-2xl shadow border border-[#C5CAFF] text-white animate-fade-in-up';
        levelCard.innerHTML = `
          <div class="mb-4">
            <div class="text-[#C5CAFF] text-sm font-semibold uppercase mb-1 tracking-wide">Unit ${level.order ?? "—"}</div>
            <div class="text-xl font-bold">${level.title || "Untitled Level"}</div>
            <div class="w-full h-2 bg-[#3a3a55] rounded-full overflow-hidden mt-2 mb-1">
              <div class="h-full bg-[#C5CAFF]" style="width: ${(progressRatio * 100).toFixed(0)}%"></div>
            </div>
            <div class="text-sm text-gray-300">Progress: ${completed}/${total}</div>
          </div>
          <div class="flex flex-col gap-3 mt-4" id="lessons-${level.id}"></div>
        `;

        const lessonContainer = levelCard.querySelector(`#lessons-${level.id}`);

        lessonsForLevel.forEach((lesson, i) => {
          const lessonCompleted = completedLessonIds.has(lesson.id);
          const prevLesson = lessonsForLevel[i - 1];
          const lessonUnlocked = i === 0 ? isUnlocked : completedLessonIds.has(prevLesson?.id);
          const isLocked = !lessonUnlocked;

          const lessonButton = document.createElement('button');
          lessonButton.className = `
            flex justify-between items-center w-full px-4 py-3 rounded-lg border transition
            ${isLocked
              ? 'bg-gray-700 border-gray-600 text-gray-400 opacity-50 cursor-not-allowed'
              : 'bg-[#1C1B2E] hover:bg-[#383857] border-[#C5CAFF] text-white'}
            ${lessonCompleted ? 'cursor-not-allowed' : ''}
          `;

          // link navigation (works inside template literal context)
          if (!isLocked && !lessonCompleted) {
            lessonButton.onclick = () =>
              window.location.href = `lesson.html?level_id=${lesson.level_id}&lesson_id=${lesson.id}`;
          }

          // proper icon markup (no stray spaces in tags)
          const lockIcon = isLocked ? `<i data-lucide="lock" class="w-4 h-4 text-gray-400 ml-2"></i>` : '';
          const checkIcon = lessonCompleted ? `<i data-lucide="check" class="w-4 h-4 text-green-400 ml-2"></i>` : '';

          // sanitized innerHTML
          lessonButton.innerHTML = `
  <div class="flex justify-between items-center w-full">
    <div class="flex flex-col items-start text-left">
      <span class="font-semibold flex items-center gap-1">
        ${lesson.title} ${lockIcon || checkIcon}
      </span>
      <span class="text-sm text-gray-400">
        ${lessonCompleted ? 'Completed' : isLocked ? 'Locked' : 'Start'}
      </span>
    </div>
    <div class="text-sm text-right text-[#FFC400] font-medium">
      +${lesson.xp_reward || 0} XP<br>+${lesson.gem_reward || 0} Gems
    </div>
  </div>
`;


          lessonContainer.appendChild(lessonButton);
        });

        container.appendChild(levelCard);
      });

      lucide.createIcons();
    }

    async function updateUserStatsWithStreakLogic() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data: userData } = await supabase
        .from('users')
        .select('hearts, gems, streak, last_active')
        .eq('id', user.id)
        .single();

      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      let updatedStreak = userData.streak || 0;

      if (userData.last_active) {
        const lastActiveDate = new Date(userData.last_active);
        const diff = Math.floor((today - lastActiveDate) / (1000 * 60 * 60 * 24));
        if (diff === 1) updatedStreak++;
        else if (diff > 1) updatedStreak = 1;
      } else updatedStreak = 1;

      if (userData.streak !== updatedStreak || !userData.last_active || userData.last_active.split('T')[0] !== todayStr) {
        await supabase.from('users').update({ streak: updatedStreak, last_active: todayStr }).eq('id', user.id);
      }

      document.querySelector('.hearts-value').textContent = userData.hearts ?? 0;
      document.querySelector('.gems-value').textContent = userData.gems ?? 0;
      document.querySelector('.streak-value').textContent = updatedStreak;
    }

    function logout() {
      supabase.auth.signOut().then(() => window.location.href = "landing.html");
    }

    updateUserStatsWithStreakLogic();
    loadLevels();
  </script>
</body>

</html>
