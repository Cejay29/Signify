<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      font-weight: 600;
      color: white;
      border-radius: 8px;
      background: transparent;
      transition: background 0.2s;
    }
    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
  </style>
</head>
<body class="flex h-screen bg-gradient-to-br from-[#1C1B2E] via-[#1C1B2E] to-[#14142B] font-inter">
  <!-- Sidebar -->
  <aside class="w-[250px] bg-[#14142b] border-r border-[#2a2a3c] p-6 flex flex-col gap-6">
    <h2 class="text-4xl font-extrabold text-[#FFC400] text-center tracking-wide">Signify</h2>
    <nav class="flex flex-col gap-4 mt-4">
      <button class="nav-btn" onclick="window.location.href='homepage.html'"><img src="img/learn.png" class="nav-icon"> LEARN</button>
      <button class="nav-btn" onclick="window.location.href='alphabet.html'"><img src="img/letter.png" class="nav-icon"> ALPHABET & MORE</button>
      <button class="nav-btn active"><img src="img/shop.png" class="nav-icon"> SHOP</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'"><img src="img/profile.png" class="nav-icon"> PROFILE</button>
      <button class="nav-btn"><img src="img/more.png" class="nav-icon"> MORE</button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto px-8 pb-12">
    <header class="fixed top-6 right-8 flex items-center gap-6 bg-[#2A2A3C] px-6 py-3 rounded-2xl shadow-lg border border-[#C5CAFF] z-20">
      <div class="flex items-center gap-2 tooltip"><img src="img/flag.png" class="w-7 h-7 rounded-full border-2 border-white" alt="Language"></div>
      <div class="flex items-center gap-2 tooltip text-white"><img src="img/fire.png" class="w-7 h-7 animate-pulse" alt="Streak"><span class="font-bold">1</span></div>
      <div class="flex items-center gap-2 tooltip text-white"><img src="img/gem.png" class="w-7 h-7" alt="Gems"><span id="gem-count" class="font-bold">...</span></div>
      <div class="flex items-center gap-2 tooltip text-white"><img src="img/heart.png" class="w-7 h-7" alt="Hearts"><span id="heart-count" class="font-bold">...</span></div>
    </header>

    <section class="pt-40 max-w-4xl mx-auto">
      <h2 class="text-white text-2xl font-bold mb-4">Buy Hearts</h2>
      <div class="flex flex-col gap-6">
        <div class="bg-[#2a2a3c] p-4 rounded-lg flex items-center gap-6">
          <img src="img/heart.png" class="w-16 h-16" alt="Heart" />
          <div class="flex-1 text-white">
            <h3 class="text-lg font-bold">Buy 3 Hearts</h3>
            <p class="text-sm text-gray-300">Spend 30 gems to get 3 hearts instantly.</p>
          </div>
          <button onclick="buyHearts(3, 30)" class="bg-[#FFC400] text-black font-bold px-4 py-2 rounded-lg">Buy</button>
        </div>

        <div class="bg-[#2a2a3c] p-4 rounded-lg flex items-center gap-6">
          <img src="img/heart.png" class="w-16 h-16" alt="Heart" />
          <div class="flex-1 text-white">
            <h3 class="text-lg font-bold">Buy 5 Hearts</h3>
            <p class="text-sm text-gray-300">Spend 45 gems to get 5 hearts instantly.</p>
          </div>
          <button onclick="buyHearts(5, 45)" class="bg-[#FFC400] text-black font-bold px-4 py-2 rounded-lg">Buy</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const { createClient } = supabase;
    const supabaseClient = createClient('https://lxetbblytlvihitapazv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4ZXRiYmx5dGx2aWhpdGFwYXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE3MzQ1OTgsImV4cCI6MjA2NzMxMDU5OH0.CqDTiPYDmaLouY5EdQHXXTTqZ233RPaa8G8jFFKSZ4g');
    let userId, hearts = 0, gems = 0;

    async function loadUserData() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      userId = user?.id;
      if (!userId) return alert('You must be logged in.');

      const { data, error } = await supabaseClient.from('users').select('hearts, gems').eq('id', userId).single();
      if (error) return alert('Failed to fetch user data');

      hearts = data.hearts;
      gems = data.gems;
      document.getElementById('gem-count').textContent = gems;
      document.getElementById('heart-count').textContent = hearts;
    }

    async function buyHearts(amount, cost) {
      if (gems < cost) return alert('Not enough gems!');

      const newHearts = hearts + amount;
      const newGems = gems - cost;

      const { error } = await supabaseClient.from('users').update({ hearts: newHearts, gems: newGems }).eq('id', userId);
      if (error) return alert('Purchase failed.');

      hearts = newHearts;
      gems = newGems;
      document.getElementById('gem-count').textContent = gems;
      document.getElementById('heart-count').textContent = hearts;

      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      alert(`Success! You bought ${amount} heart${amount > 1 ? 's' : ''}.`);
    }

    loadUserData();
  </script>
</body>
</html>
