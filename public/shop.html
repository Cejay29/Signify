<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signify | Shop</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px 14px;
      font-weight: 600;
      color: white;
      border-radius: 8px;
      transition: background 0.2s, transform 0.2s;
      width: 100%;
      text-align: left;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .shop-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .shop-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(255, 196, 0, 0.15);
    }

    .disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="flex h-screen bg-gradient-to-br from-[#1C1B2E] via-[#1C1B2E] to-[#14142B] text-white">
  <!-- Sidebar -->
  <aside class="w-[250px] bg-[#14142b] border-r border-[#2a2a3c] p-6 flex flex-col gap-6">
    <h2 class="text-4xl font-extrabold text-[#FFC400] text-center tracking-wide">Signify</h2>
    <nav class="flex flex-col gap-3 mt-4">
      <button class="nav-btn" onclick="window.location.href='homepage.html'">
        <i data-lucide="book-open" class="w-5 h-5"></i> LEARN
      </button>
      <button class="nav-btn" onclick="window.location.href='alphabet.html'">
        <i data-lucide="type" class="w-5 h-5"></i> ALPHABET & MORE
      </button>
      <button class="nav-btn active">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i> SHOP
      </button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">
        <i data-lucide="user" class="w-5 h-5"></i> PROFILE
      </button>
      <div class="relative">
        <button id="moreBtn" class="nav-btn w-full justify-between pr-4">
          <div class="flex items-center gap-2">
            <i data-lucide="more-horizontal" class="w-5 h-5"></i> <span>MORE</span>
          </div>
          <svg id="chevron" class="w-4 h-4 transition-transform duration-200 text-white" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="moreDropdown" class="hidden ml-12 mt-1 space-y-1">
          <button onclick="logout()" class="nav-btn text-red-400 hover:bg-[#3a3a55]">
            <i data-lucide="log-out" class="w-5 h-5"></i> LOGOUT
          </button>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto px-6 pb-12">
    <!-- Header Stats -->
    <header
      class="fixed top-6 right-8 flex items-center gap-6 bg-[#2A2A3C] px-6 py-3 rounded-2xl shadow-lg border border-[#C5CAFF] z-20">
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/fire.png" class="w-7 h-7 animate-pulse" alt="Streak">
        <span class="streak-value font-bold">0</span>
      </div>
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/gem.png" class="w-7 h-7" alt="Gems">
        <span class="gems-value font-bold">0</span>
      </div>
      <div class="flex items-center gap-2 tooltip text-white">
        <img src="img/heart.png" class="w-7 h-7" alt="Hearts">
        <span class="hearts-value font-bold">0</span>
      </div>
    </header>

    <!-- Shop Section -->
    <section class="pt-40 max-w-4xl mx-auto text-center">
      <h2 class="text-4xl font-extrabold text-[#FFC400] mb-6 flex justify-center items-center gap-2">
        <i data-lucide="shopping-bag" class="w-8 h-8"></i>
        Signify Shop
      </h2>
      <p class="text-gray-300 mb-12">Exchange your hard-earned gems for extra hearts to keep learning!</p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Buy 3 Hearts -->
        <div class="bg-[#2a2a3c] p-6 rounded-2xl shop-card border border-[#C5CAFF] flex flex-col items-center">
          <i data-lucide="heart" class="w-16 h-16 text-[#ff6666] mb-3"></i>
          <h3 class="text-lg font-bold mb-1">Buy 3 Hearts</h3>
          <p class="text-gray-300 mb-4">Cost: <span class="text-[#FFC400] font-semibold">30 Gems</span></p>
          <button id="buy3Btn" onclick="buyHearts(3, 30)"
            class="bg-[#FFC400] hover:bg-[#ffda66] text-black font-semibold px-6 py-2 rounded-lg transition">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i> Buy
          </button>
        </div>

        <!-- Buy 5 Hearts -->
        <div class="bg-[#2a2a3c] p-6 rounded-2xl shop-card border border-[#C5CAFF] flex flex-col items-center">
          <i data-lucide="heart" class="w-16 h-16 text-[#ff6666] mb-3"></i>
          <h3 class="text-lg font-bold mb-1">Buy 5 Hearts</h3>
          <p class="text-gray-300 mb-4">Cost: <span class="text-[#FFC400] font-semibold">45 Gems</span></p>
          <button id="buy5Btn" onclick="buyHearts(5, 45)"
            class="bg-[#FFC400] hover:bg-[#ffda66] text-black font-semibold px-6 py-2 rounded-lg transition">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i> Buy
          </button>
        </div>
      </div>

      <div id="purchaseMessage" class="mt-8 text-[#FFC400] font-semibold text-lg hidden"></div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const { createClient } = supabase;
    const supabaseClient = createClient(
      'https://lxetbblytlvihitapazv.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4ZXRiYmx5dGx2aWhpdGFwYXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE3MzQ1OTgsImV4cCI6MjA2NzMxMDU5OH0.CqDTiPYDmaLouY5EdQHXXTTqZ233RPaa8G8jFFKSZ4g'
    );

    let userId, hearts = 0, gems = 0, streak = 0;
    const msg = document.getElementById('purchaseMessage');

    const moreBtn = document.getElementById('moreBtn');
    const moreDropdown = document.getElementById('moreDropdown');
    const chevron = document.getElementById('chevron');

    moreBtn.addEventListener('click', () => {
      moreDropdown.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    });

    async function loadUserData() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      userId = user?.id;
      if (!userId) return alert('You must be logged in.');

      const { data, error } = await supabaseClient
        .from('users')
        .select('hearts, gems, streak')
        .eq('id', userId)
        .single();

      if (error) return alert('Failed to fetch user data.');

      hearts = data.hearts;
      gems = data.gems;
      streak = data.streak;

      document.querySelector('.hearts-value').textContent = hearts;
      document.querySelector('.gems-value').textContent = gems;
      document.querySelector('.streak-value').textContent = streak;

      updateButtons();
    }

    function updateButtons() {
      const buy3Btn = document.getElementById('buy3Btn');
      const buy5Btn = document.getElementById('buy5Btn');

      buy3Btn.disabled = gems < 30;
      buy5Btn.disabled = gems < 45;

      buy3Btn.classList.toggle('disabled', gems < 30);
      buy5Btn.classList.toggle('disabled', gems < 45);
    }

    async function buyHearts(amount, cost) {
      if (gems < cost) {
        msg.textContent = '❌ Not enough gems!';
        msg.classList.remove('hidden');
        return;
      }

      const newHearts = hearts + amount;
      const newGems = gems - cost;

      const { error } = await supabaseClient
        .from('users')
        .update({ hearts: newHearts, gems: newGems })
        .eq('id', userId);

      if (error) return alert('❌ Purchase failed.');

      hearts = newHearts;
      gems = newGems;
      document.querySelector('.hearts-value').textContent = hearts;
      document.querySelector('.gems-value').textContent = gems;
      updateButtons();

      msg.textContent = `✅ You bought ${amount} heart${amount > 1 ? 's' : ''}!`;
      msg.classList.remove('hidden');
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function logout() {
      supabaseClient.auth.signOut().then(() => {
        window.location.href = '/landing.html';
      });
    }

    loadUserData();
  </script>
</body>

</html>
